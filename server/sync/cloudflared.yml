# cloudflared ingress template for the sync service.
# Replace SYNC_HOSTNAME before use. Do not commit a real hostname.
# The process listens on loopback only; cloudflared on the same host forwards to it.
# On the hostname, set a Cloudflare cache rule to bypass cache. Do not enable logpush.

# The credentials file holds the tunnel secret: owner root (or the cloudflared user), mode 0600, never commit it.
#   install -m 0600 -o root -g root <downloaded>.json /etc/cloudflared/<tunnel-id>.json

tunnel: 00000000-0000-0000-0000-000000000000
credentials-file: /etc/cloudflared/00000000-0000-0000-0000-000000000000.json

ingress:
  - hostname: SYNC_HOSTNAME
    service: http://127.0.0.1:8080
  - service: http_status:404
