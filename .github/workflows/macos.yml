name: macOS

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logic:
    name: Logic tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test
      - name: Perf gate negative samples
        run: |
          if [ -x scripts/test-perf-gate.sh ]; then bash scripts/test-perf-gate.sh; else echo "skip: no perf gate yet"; fi

  mac:
    name: macOS build (${{ matrix.configuration }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Build Vela
        run: >
          xcodebuild
          -project Vela.xcodeproj
          -scheme Vela
          -destination 'platform=macOS'
          -configuration ${{ matrix.configuration }}
          CODE_SIGN_IDENTITY=-
          CODE_SIGNING_ALLOWED=NO
          -derivedDataPath "$RUNNER_TEMP/dd"
          build
      - name: Release 产物不含固定测试流钩子
        if: matrix.configuration == 'Release'
        run: scripts/check-release-no-perf-hook.sh "$RUNNER_TEMP/dd/Build/Products/Release/Vela.app"

  ios:
    name: iOS simulator build and tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Detect iOS scheme
        id: scheme
        run: |
          if [ -f Vela.xcodeproj/xcshareddata/xcschemes/VelaPhone.xcscheme ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo "VelaPhone scheme not added yet, skipping"
          fi
      - name: Build VelaPhone for simulator
        if: steps.scheme.outputs.present == 'yes'
        run: >
          xcodebuild
          -project Vela.xcodeproj
          -scheme VelaPhone
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Test VelaPhone on simulator
        if: steps.scheme.outputs.present == 'yes'
        run: |
          if ! grep -q "VelaPhoneTests" Vela.xcodeproj/project.pbxproj; then echo "no VelaPhoneTests target yet, skipping"; exit 0; fi
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          xcodebuild -project Vela.xcodeproj -scheme VelaPhone -destination "platform=iOS Simulator,id=$UDID" CODE_SIGNING_ALLOWED=NO test
      - name: Release no-perf gate negative samples
        if: steps.scheme.outputs.present == 'yes'
        run: bash scripts/test-check-ios-release-no-perf.sh
      - name: Release has no perf probe
        if: steps.scheme.outputs.present == 'yes'
        run: bash scripts/check-ios-release-no-perf.sh
      - name: Perf build is caught by the gate (negative control)
        if: steps.scheme.outputs.present == 'yes'
        run: |
          set +e
          bash scripts/check-ios-release-no-perf.sh --configuration Perf
          rc=$?
          if [ "$rc" -ne 1 ]; then echo "Perf 配置应被门拒绝（退出码 1），实际 $rc"; exit 1; fi
          echo "Perf 配置被正确拒绝"
