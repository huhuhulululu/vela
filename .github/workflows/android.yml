name: Android

on:
  push:
    paths:
      - "android/**"
      - "scripts/serve-test-stream.py"
      - "scripts/make-test-stream.sh"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "scripts/serve-test-stream.py"
      - "scripts/make-test-stream.sh"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-unit:
    name: Android unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/**/*.toml
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
      - name: Unit tests and assemble
        working-directory: android
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
      - name: Parity (per group)
        run: |
          groups=$(ls android/parity 2>/dev/null | sed -n 's/^\(skip\|split\)-\(.*\)\.tsv$/\2/p' | sort -u)
          for g in $groups; do echo "== $g"; python3 -I android/tools/parity.py --group "$g"; done
      - name: Parity --all (informational until C9 merges; C9 makes it required)
        continue-on-error: true
        run: python3 -I android/tools/parity.py --all
      - name: Check release APK
        run: |
          apk=$(find android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)
          test -n "$apk"
          sh android/tools/check-apk.sh "$apk"

  android-emulator:
    name: Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/**/*.toml
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Check KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "KVM 不可用" >&2
            exit 1
          fi
          sudo chmod 666 /dev/kvm || true
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Make test stream
        run: scripts/make-test-stream.sh
      - name: Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: "-no-window -no-audio -no-boot-anim -gpu swiftshader_indirect"
          disable-animations: true
          script: |
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
            android/tools/emulator-run.sh all
